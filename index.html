<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fcfcfd;
      color: #0f172a;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    #ascii-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .timer {
      display: flex;
      gap: 2.5rem;
      align-items: center;
    }

    @media (max-width: 640px) {
      .timer {
        gap: 1.25rem;
      }
    }

    .time-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .number {
      font-size: 5rem;
      font-weight: 300;
      letter-spacing: -0.05em;
      line-height: 1;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 640px) {
      .number {
        font-size: 2.75rem;
      }
    }

    .label {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: #94a3b8;
      margin-top: 0.75rem;
      font-weight: 400;
    }

    .separator {
      font-size: 3.5rem;
      font-weight: 200;
      color: #cbd5e1;
      margin-top: -1.25rem;
      user-select: none;
    }

    @media (max-width: 640px) {
      .separator {
        font-size: 2rem;
        margin-top: -0.75rem;
      }
    }
  </style>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

  <canvas id="ascii-canvas"></canvas>

  <main class="container">
    <div class="timer">
      <div class="time-unit">
        <span class="number" id="days">00</span>
        <span class="label">days</span>
      </div>
      <span class="separator">:</span>
      <div class="time-unit">
        <span class="number" id="hours">00</span>
        <span class="label">hours</span>
      </div>
      <span class="separator">:</span>
      <div class="time-unit">
        <span class="number" id="minutes">00</span>
        <span class="label">mins</span>
      </div>
      <span class="separator">:</span>
      <div class="time-unit">
        <span class="number" id="seconds">00</span>
        <span class="label">secs</span>
      </div>
    </div>
  </main>

  <script>
    // Target date in UTC: Exactly 14 days from Oct 17, 2026, 18:46:00 UTC -> Oct 31, 2026, 18:46:00 UTC
    const targetUTC = Date.UTC(2026, 9, 31, 18, 46, 0);

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetUTC - now;

      if (distance <= 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    // Subtle ASCII background effect
    const canvas = document.getElementById('ascii-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let particles = [];
    const chars = ['.', '+', '*', '°', '·'];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initParticles();
    }

    function initParticles() {
      particles = [];
      const count = Math.floor((width * height) / 12000);
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          char: chars[Math.floor(Math.random() * chars.length)],
          alpha: Math.random() * 0.3 + 0.1,
          speed: Math.random() * 0.15 + 0.05
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      ctx.font = '12px "Space Grotesk", monospace';

      for (let p of particles) {
        ctx.fillStyle = `rgba(148, 163, 184, ${p.alpha})`;
        ctx.fillText(p.char, p.x, p.y);
        p.y -= p.speed;
        if (p.y < 0) {
          p.y = height;
          p.x = Math.random() * width;
        }
      }
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    draw();
  </script>
</body>
</html>
